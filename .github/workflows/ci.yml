name: MatchPulse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Build Next.js application
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

      - name: Typecheck
        run: bun run typecheck

      - name: Run architecture guards
        run: bun run check:architecture

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Scan tracked files for secrets
        run: bun run check:secrets

  invariants:
    name: Domain invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clean up leftover Supabase containers
        run: |
          bunx supabase stop --no-backup || true
          docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f

      - name: Free Supabase ports
        run: |
          for port in 54321 54322 54323 54324 54325 54326 54327; do
            sudo fuser -k "${port}/tcp" || true
          done

      - name: Start local Supabase
        run: bunx supabase start

      - name: Apply migrations and seed data
        run: bunx supabase db reset

      # Credentials are read from the running stack rather than stored as
      # repository secrets, so nothing sensitive is ever committed.
      - name: Write local credentials
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local

      - name: Run domain invariant tests
        run: bun run test

      - name: Run agent CLI scenarios
        run: bun run test:agent

  delivery:
    name: Delivery and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clean up leftover Supabase containers
        run: |
          bunx supabase stop --no-backup || true
          docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f

      - name: Free Supabase ports
        run: |
          for port in 54321 54322 54323 54324 54325 54326 54327; do
            sudo fuser -k "${port}/tcp" || true
          done

      - name: Start local Supabase
        run: bunx supabase start

      - name: Apply migrations and seed data
        run: bunx supabase db reset

      - name: Write local credentials
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } > .env.local

      - name: Build Next.js application
        run: bun run build

      - name: Start application
        run: |
          bun run start > /tmp/matchpulse-app.log 2>&1 &
          echo $! > /tmp/matchpulse-app.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass"
          cat /tmp/matchpulse-app.log
          exit 1

      - name: Run smoke test
        run: bun run smoke

      - name: Exercise backup and restore
        run: |
          set -euo pipefail
          DB_CONTAINER=$(docker ps --filter "name=supabase_db" --format "{{.Names}}" | head -n 1)
          if [ -z "$DB_CONTAINER" ]; then
            echo "Supabase database container not found"
            exit 1
          fi
          echo "Database container: $DB_CONTAINER"
          MARKER_ID="44444444-4444-4444-4444-444444444444"
          RESTORE_DB="matchpulse_restore"

          # Stop the app so the drill does not depend on a live connection.
          if [ -f /tmp/matchpulse-app.pid ]; then
            kill "$(cat /tmp/matchpulse-app.pid)" || true
          fi
          sleep 2
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "INSERT INTO public.tournaments (id, name, max_capacity, current_players) VALUES ('$MARKER_ID', 'Recovery drill marker', 10, 0) ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name;"

          query() {
            docker exec "$DB_CONTAINER" psql -U postgres -d "${2:-postgres}" -tAc "$1"
          }

          TABLES_BEFORE=$(query "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';")
          POLICIES_BEFORE=$(query "SELECT count(*) FROM pg_policies WHERE schemaname = 'public';")
          TOURNAMENTS_BEFORE=$(query "SELECT count(*) FROM public.tournaments;")

          # Back up the application-owned public schema. Platform-managed
          # schemas (auth, storage, realtime, vault) are recreated by Supabase
          # itself and are not part of this application backup.
          docker exec "$DB_CONTAINER" pg_dump -U postgres -d postgres \
            --schema=public -Fc -f /tmp/matchpulse-public.dump
          docker cp "$DB_CONTAINER:/tmp/matchpulse-public.dump" /tmp/matchpulse-public.dump
          test -s /tmp/matchpulse-public.dump
          echo "Backup size: $(wc -c < /tmp/matchpulse-public.dump) bytes"

          docker exec "$DB_CONTAINER" dropdb -U postgres --if-exists "$RESTORE_DB"
          docker exec "$DB_CONTAINER" createdb -U postgres -T template0 "$RESTORE_DB"

          # Minimal auth dependency for the public schema: profiles references
          # auth.users(id) and RLS policies call auth.uid().
          docker exec -i "$DB_CONTAINER" psql -U postgres -d "$RESTORE_DB" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id UUID PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID
            LANGUAGE SQL STABLE AS $$ SELECT NULL::UUID $$;
          SQL

          set +e
          docker exec "$DB_CONTAINER" pg_restore -U postgres -d "$RESTORE_DB" \
            --clean --if-exists --no-owner --no-privileges /tmp/matchpulse-public.dump
          RESTORE_STATUS=$?
          set -e
          # pg_restore reports expected "does not exist" errors while cleaning a
          # fresh scratch database. The restored-state assertions below are the
          # gate; the status is printed for the record.
          echo "pg_restore exit status: $RESTORE_STATUS"

          TABLES_AFTER=$(query "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';" "$RESTORE_DB")
          POLICIES_AFTER=$(query "SELECT count(*) FROM pg_policies WHERE schemaname = 'public';" "$RESTORE_DB")
          TOURNAMENTS_AFTER=$(query "SELECT count(*) FROM public.tournaments;" "$RESTORE_DB")
          MARKER=$(query "SELECT name FROM public.tournaments WHERE id = '$MARKER_ID';" "$RESTORE_DB")

          echo "tables: $TABLES_BEFORE -> $TABLES_AFTER"
          echo "RLS policies: $POLICIES_BEFORE -> $POLICIES_AFTER"
          echo "tournaments: $TOURNAMENTS_BEFORE -> $TOURNAMENTS_AFTER"
          echo "restored marker: $MARKER"

          test "$TABLES_BEFORE" = "$TABLES_AFTER"
          test "$POLICIES_BEFORE" = "$POLICIES_AFTER"
          test "$TOURNAMENTS_BEFORE" = "$TOURNAMENTS_AFTER"
          test "$MARKER" = "Recovery drill marker"

          docker exec "$DB_CONTAINER" dropdb -U postgres "$RESTORE_DB"

          # The working database was not changed; restart the app and re-run
          # smoke to prove the drill did not disturb it.
          bun run start > /tmp/matchpulse-app.log 2>&1 &
          echo $! > /tmp/matchpulse-app.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Health check did not pass after the drill"
              cat /tmp/matchpulse-app.log
              exit 1
            fi
            sleep 2
          done
          bun run smoke

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/matchpulse-app.pid ]; then
            kill "$(cat /tmp/matchpulse-app.pid)" || true
          fi
          cat /tmp/matchpulse-app.log || true

  fault-injection:
    name: Fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clean up leftover Supabase containers
        run: |
          bunx supabase stop --no-backup || true
          docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f

      - name: Free Supabase ports
        run: |
          for port in 54321 54322 54323 54324 54325 54326 54327; do
            sudo fuser -k "${port}/tcp" || true
          done

      - name: Start local Supabase
        run: bunx supabase start

      - name: Apply migrations and seed data
        run: bunx supabase db reset

      - name: Write local credentials
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local

      - name: Run fault-injection matrix
        run: bun run fault:inject
        env:
          P95_STRICT: "false"

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clean up leftover Supabase containers
        run: |
          bunx supabase stop --no-backup || true
          docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f

      - name: Free Supabase ports
        run: |
          for port in 54321 54322 54323 54324 54325 54326 54327; do
            sudo fuser -k "${port}/tcp" || true
          done

      - name: Start local Supabase
        run: bunx supabase start

      - name: Apply migrations and seed data
        run: bunx supabase db reset

      - name: Write local credentials
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local

      - name: Create organizer and club fixtures
        run: |
          bun run auth:organizer
          bun run auth:club

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Build application
        run: bun run build

      - name: Run E2E and accessibility tests
        run: bun run test:e2e

      - name: Generate PDF submissions
        run: bun run docs:pdf

      - name: Upload PDF submissions
        uses: actions/upload-artifact@v4
        with:
          name: pdf-submissions
          path: docs/submissions/*.pdf
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
