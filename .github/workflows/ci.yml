name: MatchPulse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Build Next.js application
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

      - name: Typecheck
        run: bun run typecheck

      - name: Run architecture guards
        run: bun run check:architecture

  invariants:
    name: Domain invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase start

      - name: Apply migrations and seed data
        run: bunx supabase db reset

      # Credentials are read from the running stack rather than stored as
      # repository secrets, so nothing sensitive is ever committed.
      - name: Write local credentials
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local

      - name: Run domain invariant tests
        run: bun run test

  delivery:
    name: Delivery and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase start

      - name: Apply migrations and seed data
        run: bunx supabase db reset

      - name: Write local credentials
        run: |
          eval "$(bunx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } > .env.local

      - name: Build Next.js application
        run: bun run build

      - name: Start application
        run: |
          bun run start > /tmp/matchpulse-app.log 2>&1 &
          echo $! > /tmp/matchpulse-app.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass"
          cat /tmp/matchpulse-app.log
          exit 1

      - name: Run smoke test
        run: bun run smoke

      - name: Exercise backup and restore
        run: |
          set -euo pipefail
          DB_CONTAINER=$(docker ps --filter "name=supabase_db" --format "{{.Names}}" | head -n 1)
          if [ -z "$DB_CONTAINER" ]; then
            echo "Supabase database container not found"
            exit 1
          fi
          echo "Database container: $DB_CONTAINER"
          MARKER_ID="44444444-4444-4444-4444-444444444444"

          # Stop the app before resetting the database, then insert a marker row
          # that only a successful data restore can bring back.
          if [ -f /tmp/matchpulse-app.pid ]; then
            kill "$(cat /tmp/matchpulse-app.pid)" || true
          fi
          sleep 2
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "INSERT INTO public.tournaments (id, name, max_capacity, current_players) VALUES ('$MARKER_ID', 'Recovery drill marker', 10, 0) ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name;"

          query() {
            docker exec "$DB_CONTAINER" psql -U postgres -d "${2:-postgres}" -tAc "$1"
          }

          TABLES_BEFORE=$(query "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';")
          POLICIES_BEFORE=$(query "SELECT count(*) FROM pg_policies WHERE schemaname = 'public';")
          TOURNAMENTS_BEFORE=$(query "SELECT count(*) FROM public.tournaments;")

          docker exec "$DB_CONTAINER" pg_dump -U postgres -d postgres \
            --data-only --schema=public --column-inserts --disable-triggers -f /tmp/matchpulse-data.sql
          docker cp "$DB_CONTAINER:/tmp/matchpulse-data.sql" /tmp/matchpulse-data.sql
          test -s /tmp/matchpulse-data.sql
          echo "Backup size: $(wc -c < /tmp/matchpulse-data.sql) bytes"

          # Rebuild the schema from migrations, clear the seed rows, and restore
          # the data backup. Schema recovery comes from migrations; data recovery
          # comes from the dump.
          bunx supabase db reset
          TRUNCATE_SQL=$(query "SELECT 'TRUNCATE TABLE ' || string_agg(format('%I.%I', schemaname, tablename), ', ') || ' RESTART IDENTITY CASCADE;' FROM pg_tables WHERE schemaname = 'public';")
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "$TRUNCATE_SQL"
          docker cp /tmp/matchpulse-data.sql "$DB_CONTAINER:/tmp/matchpulse-data.sql"
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/matchpulse-data.sql

          TABLES_AFTER=$(query "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';")
          POLICIES_AFTER=$(query "SELECT count(*) FROM pg_policies WHERE schemaname = 'public';")
          TOURNAMENTS_AFTER=$(query "SELECT count(*) FROM public.tournaments;")
          MARKER=$(query "SELECT name FROM public.tournaments WHERE id = '$MARKER_ID';")

          echo "tables: $TABLES_BEFORE -> $TABLES_AFTER"
          echo "RLS policies: $POLICIES_BEFORE -> $POLICIES_AFTER"
          echo "tournaments: $TOURNAMENTS_BEFORE -> $TOURNAMENTS_AFTER"
          echo "restored marker: $MARKER"

          test "$TABLES_BEFORE" = "$TABLES_AFTER"
          test "$POLICIES_BEFORE" = "$POLICIES_AFTER"
          test "$TOURNAMENTS_BEFORE" = "$TOURNAMENTS_AFTER"
          test "$MARKER" = "Recovery drill marker"

          # Prove the application works against the recovered data.
          bun run start > /tmp/matchpulse-app.log 2>&1 &
          echo $! > /tmp/matchpulse-app.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Health check did not pass after restore"
              cat /tmp/matchpulse-app.log
              exit 1
            fi
            sleep 2
          done
          bun run smoke

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/matchpulse-app.pid ]; then
            kill "$(cat /tmp/matchpulse-app.pid)" || true
          fi
          cat /tmp/matchpulse-app.log || true
